name: Maven CI + Trigger Jenkins

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Temurin JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Build with Maven
        working-directory: app
        run: mvn -B -DskipTests=false clean package

      - name: Archive WAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: insured-assurance-war
          path: app/target/*.war

      - name: Trigger Jenkins deployment
        env:
          JENKINS_URL: ${{ secrets.JENKINS_URL }}
          JENKINS_USER: ${{ secrets.JENKINS_USER }}
          JENKINS_API_TOKEN: ${{ secrets.JENKINS_API_TOKEN }}
          JENKINS_JOB: ${{ secrets.JENKINS_JOB }}
        run: |
          echo "Triggering Jenkins Job: $JENKINS_JOB"
          
          curl -X POST "$JENKINS_URL/job/$JENKINS_JOB/build?token=github-actions-token" \
            --user "$JENKINS_USER:$JENKINS_API_TOKEN" \
            -v